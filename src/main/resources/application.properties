# PRP Bench defaults — override via env vars or k8s ConfigMap.
# Env convention: PRP_BENCH_MODE=SENDER, PRP_BENCH_TARGET_HOST=10.10.10.2, etc.

prp-bench.mode=SENDER
prp-bench.target-host=10.10.10.2
prp-bench.bind-address=0.0.0.0
prp-bench.data-port=9200
prp-bench.ack-port=9201
prp-bench.payload-bytes=256
prp-bench.messages-per-second=50000
prp-bench.duration-seconds=0

quarkus.http.port=8080

# The dashboard ships inside a :latest image that is redeployed constantly.
# Quarkus otherwise serves it with "immutable, max-age=24h", so a browser keeps
# showing the previous build for a day and never revalidates.
quarkus.http.static-resources.caching-enabled=false
quarkus.micrometer.export.prometheus.enabled=true

quarkus.container-image.group=rhn_support_arolivei
quarkus.container-image.name=prp-bench
quarkus.container-image.tag=latest
