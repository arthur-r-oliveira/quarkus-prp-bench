# Build → Push → Scan → Report for the PRP Bench image variants.
#
# Runs on a self-hosted runner (this workstation) so podman, local caches, and an
# existing quay.io login can be reused. Secrets are optional on self-hosted:
# QUAY_USERNAME / QUAY_TOKEN override the host login; LIGHTWELL_* enable the
# third variant. Never put credential values in this file or in git.
#
# Deliberately non-blocking on scan: the legacy variant is expected to accumulate
# findings — that is the control in the supply-chain demo. Build and push failures
# fail the job.
#
# PRs build + scan + report only. Push runs on main, schedule, and workflow_dispatch.
name: Build Push Scan Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Daily: legacy picks up dnf updates; hardened picks up newer hi/openjdk:21 content.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Build, push, scan, report
    runs-on: [self-hosted, prp-bench]
    # Do not continue-on-error at job level — a failed build must go red.

    env:
      LW_USER: ${{ secrets.LIGHTWELL_USER }}
      LW_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      REGISTRY: quay.io
      NAMESPACE: rhn_support_arolivei
      REPOSITORY: prp-bench

    steps:
      - uses: actions/checkout@v4

      # On this self-hosted runner, credentials may live outside git:
      #   ~/.config/prp-bench/ci.env  (preferred) or the workspace target/local-credentials.env
      # GitHub Actions secrets win when set. Values are never written into the repo.
      - name: Load local credentials if secrets are empty
        run: |
          set -euo pipefail
          load_file() {
            local f="$1"
            [[ -f "$f" ]] || return 1
            # shellcheck disable=SC1090
            set -a
            source "$f"
            set +a
            echo "Loaded credential file $f"
            return 0
          }
          if [[ -z "${LW_USER}" || -z "${LW_TOKEN}" ]]; then
            load_file "${HOME}/.config/prp-bench/ci.env" \
              || load_file "${GITHUB_WORKSPACE}/target/local-credentials.env" \
              || true
            if [[ -n "${LW_USER:-}" && -n "${LW_TOKEN:-}" ]]; then
              echo "LW_USER=${LW_USER}" >> "$GITHUB_ENV"
              echo "LW_TOKEN=${LW_TOKEN}" >> "$GITHUB_ENV"
            fi
          fi

      # ----------------------------------------------------------------- Build
      - name: Build legacy variant (UBI9 / JDK 17)
        run: podman build -t prp-bench:legacy -f Containerfile .

      - name: Build hardened variant (hi/openjdk:21)
        run: podman build -t prp-bench:hardened -f Containerfile.hardened .

      - name: Build Lightwell variants (legacy + hardened)
        run: |
          set -euo pipefail
          if [[ -z "${LW_USER:-}" || -z "${LW_TOKEN:-}" ]]; then
            echo "Skipping Lightwell variants — no LIGHTWELL secrets and no local ci.env"
            exit 0
          fi
          mkdir -p target
          umask 077
          LW_ACTIVE_PROFILE="lightwell-${LW_REPO:-validated}" \
          python3 -I -c '
          import os, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              text = fh.read()
          for key in ("LW_USER", "LW_TOKEN", "LW_ACTIVE_PROFILE"):
              text = text.replace("__%s__" % key, os.environ[key])
          with open(sys.argv[2], "w", encoding="utf-8") as fh:
              fh.write(text)
          ' tools/maven-settings-lightwell.xml.template target/maven-settings-lightwell.xml
          podman build -t prp-bench:legacy-lightwell \
            -f Containerfile.legacy-lightwell \
            --secret id=lightwell-settings,src=target/maven-settings-lightwell.xml .
          podman build -t prp-bench:hardened-lightwell \
            -f Containerfile.lightwell \
            --secret id=lightwell-settings,src=target/maven-settings-lightwell.xml .
          rm -f target/maven-settings-lightwell.xml

      # ----------------------------------------------------------------- Push
      # Prefer GitHub Actions secrets. On this self-hosted runner, fall back to an
      # existing `podman login quay.io` on the host so the laptop login can push
      # without storing the password in the repo.
      - name: Resolve Quay credentials
        id: quay
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [[ -n "${QUAY_USERNAME}" && -n "${QUAY_TOKEN}" ]]; then
            echo "mode=secrets" >> "$GITHUB_OUTPUT"
            echo "Using QUAY_* repository secrets"
          elif podman login --get-login "$REGISTRY" >/dev/null 2>&1; then
            echo "mode=host" >> "$GITHUB_OUTPUT"
            echo "Using existing podman login for $REGISTRY ($(podman login --get-login "$REGISTRY"))"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "No Quay credentials (secrets or host login) — push will be skipped"
          fi

      - name: Log in to Quay
        if: >-
          github.event_name != 'pull_request'
          && steps.quay.outputs.mode == 'secrets'
        run: podman login "$REGISTRY" -u "$QUAY_USERNAME" --password-stdin <<<"$QUAY_TOKEN"

      - name: Push image variants
        id: push
        if: >-
          github.event_name != 'pull_request'
          && steps.quay.outputs.mode != 'skip'
          && steps.quay.outputs.mode != ''
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          TARGET="${REGISTRY}/${NAMESPACE}/${REPOSITORY}"
          PUSHED=()

          for variant in legacy legacy-lightwell hardened hardened-lightwell; do
            podman image exists "prp-bench:${variant}" || continue
            podman tag "prp-bench:${variant}" "${TARGET}:${variant}"
            podman tag "prp-bench:${variant}" "${TARGET}:${variant}-${SHA}"
            podman push "${TARGET}:${variant}"
            podman push "${TARGET}:${variant}-${SHA}"
            PUSHED+=("${TARGET}:${variant}" "${TARGET}:${variant}-${SHA}")
            echo "pushed ${TARGET}:${variant} and :${variant}-${SHA}"
          done

          # Keep k8s/base (:latest) working without a separate manual push.
          if podman image exists prp-bench:legacy; then
            podman tag prp-bench:legacy "${TARGET}:latest"
            podman push "${TARGET}:latest"
            PUSHED+=("${TARGET}:latest")
            echo "pushed ${TARGET}:latest (alias of legacy)"
          fi

          {
            echo "sha=${SHA}"
            echo "tags<<EOF"
            printf '%s\n' "${PUSHED[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------- Scan
      - name: Scan all built variants (grype / trivy / syft)
        continue-on-error: true
        run: tools/scan-images.sh --no-build

      # Quay Clair is the customer-facing scanner (Security tab on the tags page).
      # Public API — no token. Poll after push so a just-uploaded digest can finish.
      - name: Fetch Quay Security Scanner results
        continue-on-error: true
        env:
          QUAY_NAMESPACE: ${{ env.NAMESPACE }}
          QUAY_REPOSITORY: ${{ env.REPOSITORY }}
          QUAY_POLL_SECONDS: "300"
        run: tools/quay-scan-report.sh

      # ----------------------------------------------------------------- Report
      - name: Publish report to the run summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Build / Push / Scan / Report"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Runner: self-hosted (\`prp-bench\`)"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Quay: [rhn_support_arolivei/prp-bench tags](https://quay.io/repository/rhn_support_arolivei/prp-bench?tab=tags)"
            echo "- Dashboard: [CI scan history](https://arthur-r-oliveira.github.io/quarkus-prp-bench/)"
            echo ""
            echo "> **Layers:** Hardened Images → \`grype OS\` / size. Lightwell → \`grype app\`."
            echo "> On \`validated\`, \*-lightwell matching Central is expected (provenance)."
            echo "> CVE patches need \`remediated\` + \`.rhlw-*\` pins — not a substitute for HI."
            echo ""
            if [[ -f target/scans/summary.md ]]; then
              cat target/scans/summary.md
            else
              echo "_No local scan summary produced._"
            fi
            echo ""
            if [[ -f target/scans/quay-summary.md ]]; then
              cat target/scans/quay-summary.md
            else
              echo "## Quay Security Scanner"
              echo ""
              echo "_No Quay summary produced._"
            fi
            echo ""
            echo "## Push"
            echo ""
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "Skipped on pull_request."
            elif [[ "${{ steps.quay.outputs.mode }}" == "skip" || -z "${{ steps.quay.outputs.mode }}" ]]; then
              echo "Skipped — no Quay credentials."
            elif [[ -n "${{ steps.push.outputs.tags }}" ]]; then
              echo "Mode: \`${{ steps.quay.outputs.mode }}\`"
              echo ""
              echo '```'
              echo "${{ steps.push.outputs.tags }}"
              echo '```'
            else
              echo "Push step did not run or produced no tags."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOMs and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scans
          path: |
            target/scans/*.json
            target/scans/summary.md
            target/scans/quay-summary.md
          if-no-files-found: warn
          retention-days: 30

      # ----------------------------------------------------------------- Dashboard (GitHub Pages)
      # Aggregate every successful run's image-scans artifact into a durable
      # history chart. PRs skip publish; push/schedule/dispatch update Pages.
      - name: Harvest prior scan artifacts
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci-dashboard/harvest-artifacts.sh target/ci-dashboard-artifacts

      - name: Pull previously published history (if any)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p target/ci-dashboard-prior
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/history.json"
          if curl -fsSL "$url" -o target/ci-dashboard-prior/history.json; then
            echo "Loaded prior history from $url"
          else
            echo "No prior published history yet"
            rm -f target/ci-dashboard-prior/history.json
          fi

      - name: Build CI dashboard site
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          args=(
            --out target/ci-dashboard-site
            --run-id "${{ github.run_id }}"
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            --sha "${{ github.sha }}"
            --event "${{ github.event_name }}"
          )
          if [[ -d target/ci-dashboard-artifacts ]]; then
            args+=(--artifacts-root target/ci-dashboard-artifacts)
          fi
          if [[ -d target/scans ]]; then
            args+=(--current target/scans)
          fi
          if [[ -f target/ci-dashboard-prior/history.json ]]; then
            args+=(--history-in target/ci-dashboard-prior/history.json)
          fi
          python3 tools/ci-dashboard/build.py "${args[@]}"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/ci-dashboard-site

  publish-dashboard:
    name: Publish CI dashboard
    needs: pipeline
    if: github.event_name != 'pull_request' && needs.pipeline.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summarize
        run: |
          {
            echo "## CI dashboard"
            echo ""
            echo "Published: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "If this is the first deploy, set **Settings → Pages → Source: GitHub Actions**."
          } >> "$GITHUB_STEP_SUMMARY"
